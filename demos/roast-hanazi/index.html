<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>AI 翻车现场</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Fonts come from /assets/fonts/fonts.css (files listed in assets/fonts/README.md); every stack ends in system fallbacks. */
:root{--ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F5F8}
svg.L{position:absolute;left:0;top:0;overflow:visible}
#cardwrap{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#cardborder{position:absolute;background:#fff;border-radius:36px;display:none}
#shot{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#F4F5F8}

/* ---------- the "screen recording": a generic chat app ---------- */
#screen{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:#F4F5F8;color:#1B1D24;font-family:var(--ui)}
.sb{position:absolute;left:0;top:0;width:1080px;height:84px}
.sb .time{position:absolute;left:66px;top:20px;font:600 36px/44px var(--ui)}
.sb svg{position:absolute;right:52px;top:24px}
.hd{position:absolute;left:0;top:84px;width:1080px;height:146px;box-sizing:border-box;border-bottom:2px solid #E2E4EB;background:#F4F5F8}
.hd .back{position:absolute;left:30px;top:42px}
.hd .ttl{position:absolute;left:0;right:0;top:20px;text-align:center;font:600 44px/56px var(--ui)}
.hd .sub{position:absolute;left:0;right:0;top:80px;text-align:center;font:400 28px/36px var(--ui);color:#8C91A0}
.hd .more{position:absolute;right:40px;top:58px}
#vp{position:absolute;left:0;top:230px;width:1080px;height:1460px;overflow:hidden}
#content{position:absolute;left:0;top:0;width:1080px;padding-top:30px}
.date{text-align:center;font:400 28px/40px var(--ui);color:#9AA0AD;margin-bottom:30px}
.msg{display:flex;margin:0 36px 36px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.bubble{box-sizing:border-box;font:400 46px/1.55 var(--ui);padding:24px 36px;border-radius:40px;max-width:780px}
.user .bubble{background:#D8E7FF;color:#13213A;border-bottom-right-radius:12px}
.ai .av{flex:0 0 76px;width:76px;height:76px;margin-right:18px}
.ai .av svg{display:block}
.ai .col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.ai .nm{font:500 28px/36px var(--ui);color:#8C91A0;margin:0 0 10px 8px}
.ai .bubble{background:#fff;border:2px solid #E3E5EC;border-top-left-radius:12px;color:#1B1D24}
.ai .bubble.typing{display:flex;gap:14px;padding:32px 38px}
.typing i{display:block;width:18px;height:18px;border-radius:50%;background:#A3A8B6}
#a1b{width:888px;max-width:none;overflow:hidden;font-size:44px;line-height:1.6;padding:26px 34px}
#a1t{position:relative}
#a1t .p+.p{margin-top:14px}
#a1t .aside{color:#8C91A0}
.neg{white-space:nowrap;background-image:linear-gradient(transparent 56%,#FFE14D 56%,#FFE14D 94%,transparent 94%);background-repeat:no-repeat;background-size:0% 100%;border-radius:4px}
.neg.on{color:#E8283C}
.mask{display:inline-block;width:3.2em;height:1.05em;vertical-align:-.16em;margin:0 2px;border-radius:6px;
  background:repeating-conic-gradient(#6C7080 0 25%,#A9ADBA 0 50%) 0 0/16px 16px}
#cur{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 0;border-radius:50%;background:#1B1D24}
.ib{position:absolute;left:0;top:1690px;width:1080px;height:230px;box-sizing:border-box;background:#fff;border-top:2px solid #E2E4EB}
.ib .plus{position:absolute;left:36px;top:32px;width:88px;height:88px}
.ib .field{position:absolute;left:144px;top:30px;width:756px;height:92px;box-sizing:border-box;border-radius:46px;background:#F1F2F6;padding:0 36px;font:400 38px/92px var(--ui);color:#A3A8B6}
.ib .send{position:absolute;left:920px;top:30px;width:92px;height:92px}

/* ---------- hero: the Q/A cut out as stickers on rays ---------- */
#hero{position:absolute;left:0;top:0;width:1080px;height:1920px;visibility:hidden}
#heroQ,#heroA{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--ui)}
#heroQ .msg,#heroA .msg{margin:0}
.sticker .bubble{box-shadow:0 0 0 10px #fff,0 22px 34px rgba(30,16,60,.35)}
.sticker .av svg{border-radius:24px;box-shadow:0 0 0 8px #fff,0 16px 26px rgba(30,16,60,.3)}
.sticker .nm{color:#1E2A78;font-weight:700;background:#fff;border-radius:20px;padding:2px 16px;margin-left:0}

#dim{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#150F2C;opacity:0;pointer-events:none}
/* ---------- end egg: the reviewer AI's note, pinned under the card ---------- */
#egg{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--ui);visibility:hidden}
#egg .msg{margin:0}
#egg .bubble{max-width:880px;font-size:40px;line-height:1.55;padding:22px 32px}
#egg .nm{display:flex;align-items:center;gap:12px}
#egg .tag{font:700 26px/34px var(--ui);color:#fff;background:#FF3D7F;border-radius:17px;padding:1px 14px}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;
  background:radial-gradient(ellipse 85% 64% at 50% 48%, rgba(0,0,0,0) 60%, rgba(22,14,40,.26) 100%)}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;background:url(/assets/textures/grain/grain_fine_2048.png);
  mix-blend-mode:overlay;opacity:.07;pointer-events:none}
</style></head>

  for (const [i, L] of B.lines.entries()) {
    const u = t - L.t0, po = popOut(t, C.clear + i * FR), v = u >= 0 && po > 0; disp(L.g, v); if (!v) continue;
    const hold = clamp((u - .2) / .3), s = spring(u, .5, 22) * po * (1 + hold * .01 * Math.sin(2 * Math.PI * 2.2 * t + L.ph));
    const r = L.rot + L.r0 * (1 - spring(u, .45, 18)) + hold * .7 * Math.sin(2 * Math.PI * 1.1 * t + L.ph), y = L.cy - 30 * (1 - spring(u, .55, 20)) + hold * 2.5 * Math.sin(2 * Math.PI * 1.1 * t + L.ph + 1.9);
    X(L.g, L.cx + off.x, y + off.y, r, s);
    const ku = t - L.kt0; show(L.kw.g, ku >= 0);
    if (ku >= 0) X(L.kw.g, L.kw.x, L.kw.y, (i % 2 ? 4 : -4) + (i % 2 ? -16 : 16) * (1 - spring(ku, .45, 18)) + clamp((ku - .2) / .3) * 2.5 * Math.sin(2 * Math.PI * 1.6 * t + L.ph), spring(ku, .42, 24) * (1 + .03 * Math.sin(2 * Math.PI * 2.4 * t + L.ph)));
  }
  // 哔～ rides on the mosaic as it streams in
  { const c = B.beep.items[0], f = charXf(t, c, { wig: 3, bob: 2, t1: C.beep + .45 }), v = !!f && t < C.clear; show(c.g, v);
    if (v) { const m = U[B.maskU], p = toScreen(SC.txt.x + m.l + m.w / 2, SC.txt.y + m.t, cam, s); X(c.g, p.x, p.y - 62 + f.y, -6 + f.r, f.s); } }
  // ？？？ hop on the beat
  for (const [i, c] of B.qm.items.entries()) {
    const f = charXf(t, c, { wig: 0, bob: 0, t1: C.clear + i * FR }); if (!f) { show(c.g, false); continue; } show(c.g, true);
    const u = t - c.t0, ph = ((t - C.qmarks[0] - .25 - i * .083) / .5 % 1 + 1) % 1, on = clamp((u - .2) / .15);
    const hop = on * 46 * 4 * ph * (1 - ph), sq = on * Math.exp(-Math.pow(Math.min(ph, 1 - ph) / .07, 2));
    X(c.g, c.x + off.x, c.y - hop + off.y, c.rot + f.r + on * 5 * Math.sin(2 * Math.PI * ph), f.s * (1 + .12 * sq), f.s * (1 - .14 * sq));
  }
  // 时区守门员 seal slams on the snare
  { const u = t - (C.stamp1 - .13), po = popOut(t, C.clear + 2 * FR), v = u >= 0 && po > 0; show(B.stamp1, v);
    if (v) { let sc, o = 1; if (t < C.stamp1) { const k = u / .13; sc = lerp(2.5, 1, E.inQuad(k)); o = clamp(k * 2.2); } else { const w = t - C.stamp1; sc = 1 - .09 * Math.exp(-w * 16) * Math.cos(w * 44); }
      B.stamp1.setAttribute('opacity', o.toFixed(3)); X(B.stamp1, 560 + off.x * .5, 860 + off.y * .5, -12 + (t < C.stamp1 ? -10 * (1 - u / .13) : 0) + .8 * Math.sin(t * 2.2), sc * po); } }
  // （小声） typed out beside the question, sweat drops on its corner (both track the bubble through scroll + camera)
  { const v = t >= C.aside && t < C.hero; show(B.asideG, v);
    const q = toScreen(SC.u2.x, SC.u2.y, cam, s), qb = toScreen(SC.u2.x, SC.u2.y + SC.u2.h, cam, s);
    if (v) { const u = t - C.aside, n = Math.floor(u * 30) + 1;
      B.aclip.setAttribute('width', (clamp(n / 5) * (B.aw + 40)).toFixed(1));
      const sc = cam.Z * (.94 + .06 * spring(u, .6, 22)), w = Math.sin(2 * Math.PI * .7 * t) * .8;
      B.asideG.setAttribute('transform', `translate(${(q.x - 24 - B.aw * sc).toFixed(1)} ${((q.y + qb.y) / 2 - 4).toFixed(1)}) rotate(${(-6 + w).toFixed(2)}) scale(${sc.toFixed(4)})`); }
    for (const d of B.sweat) {
      const u = t - d.t0, vv = u >= 0 && t < C.hero; show(d.g, vv); if (!vv) continue;
      const sc = spring(u, .5, 24) * d.s * cam.Z * .8, slide = 60 * E.inQuad(clamp((u - .15) / .75));
      d.g.setAttribute('opacity', (1 - clamp((u - .8) / .2)).toFixed(3));
      X(d.g, q.x + d.dx, q.y + d.dy + slide, 12, sc * (1 - .05 * clamp(slide / 60)), sc * (1 + .12 * clamp(slide / 60)));
    } }

  // hero: focus lines, burst, 震惊！！
  { const hero = t >= C.hero && t < TOUT + .17, boil = Math.floor(Math.min(t, C.freeze) * 12) % 3, po = popOut(t, TOUT);
    show(B.focus, hero && t < TOUT); show(B.burst, hero); show(B.burstBack, hero);
    if (hero) {
      const u = t - C.hero; B.focus.setAttribute('d', focusD(540, 720, 300 + boil)); B.focus.setAttribute('opacity', (.95 - .25 * clamp(u / .6)).toFixed(3));
      const bs = spring(u + 2 * FR, .42, 24) * po, cx = 540 + off.x, cy = 1330 + off.y;
      B.burst.setAttribute('d', burstD(0, 0, 432, 288, 15, 100 + boil)); B.burstBack.setAttribute('d', burstD(0, 0, 452, 304, 15, 200 + boil));
      X(B.burst, cx, cy, -5 + 1.2 * Math.sin(t * 7), bs); X(B.burstBack, cx + 16, cy + 18, -3, bs);
    }
    driveHZ(t, B.shock, { from: C.hero, t1: TOUT, wig: 2.4, bob: 3, wf: 1.6 }, off); }

  // end card
  for (const sp of B.sp2) { const u = t - sp.t0; show(sp.e, u >= 0); if (u >= 0) X(sp.e, sp.x, sp.y, u * 50 + sp.y, spring(u, .4, 26) * (.78 + .22 * Math.sin(2 * Math.PI * 1.6 * t + sp.y))); }
  { const u = t - (C.stamp2 - .13), v = u >= 0; show(B.stamp2, v);
    if (v) { let sc, o = 1; if (t < C.stamp2) { const k = u / .13; sc = lerp(2.4, 1, E.inQuad(k)); o = clamp(k * 2.2); } else { const w = t - C.stamp2; sc = 1 - .09 * Math.exp(-w * 16) * Math.cos(w * 44); }
      const K2 = kick(t, C.stamp2, 14, 10, 13);
      B.stamp2.setAttribute('opacity', o.toFixed(3)); X(B.stamp2, 600 + K2.x * .5, 1148 + K2.y * .5, -7 + (t < C.stamp2 ? -9 * (1 - u / .13) : 0) + .7 * Math.sin(t * 2.3), sc * .9); } }
  { const u = t - C.sub1, v = u >= 0; show(B.sub1G, v);
    if (v) { B.sclip.setAttribute('width', (clamp((Math.floor(u * 30) + 1) / 6) * B.sw).toFixed(1));
      B.sub1G.setAttribute('transform', `rotate(${(-2 + .6 * Math.sin(2 * Math.PI * .8 * t)).toFixed(2)} 540 1712)`); } }
  driveHZ(t, B.sub2, { wig: 3, bob: 3, wf: 1.3 });

  // counter: one pop per counted 不能, the 14th turns red, shakes and sprouts emphasis marks; the reviewer's nitpick makes 15
  { const tv = [...C.ticks, C.tick15].map(k => k + FR), n = tv.filter(k => t >= k).length, v = n > 0; disp(B.ctr, v);
    if (v) { const ut = t - tv[n - 1], u0 = t - tv[0], max = n >= C.ticks.length, over = n > C.ticks.length, um = t - tv[C.ticks.length - 1];
      if (B.numN !== n) { B.num.texts.forEach(e => { e.textContent = String(n); }); B.numN = n; }
      B.num.fillEl.setAttribute('fill', max ? B.numR : B.numY);
      const ns = lerp(over ? 2.6 : max ? 2.1 : 1.7, over ? 1.22 : max ? 1.12 : 1, spring(ut, .45, 26)), nr = (n % 2 ? 1 : -1) * 10 * (1 - spring(ut, .45, 20));
      const buzz = over ? 2.5 * Math.sin(2 * Math.PI * 9 * t) : 0;   // 15 keeps vibrating against the end stop
      X(B.num.g, B.numX + buzz, 8, nr + (max ? 2.5 * Math.sin(2 * Math.PI * 1.7 * t) : 0), ns);
      const ps = 1 + .07 * Math.exp(-ut * 14) * Math.cos(ut * 38) + (max ? .05 * Math.exp(-um * 8) * Math.cos(um * 30) : 0);
      const sh = over ? kick(t, tv[n - 1], 18, 7, 14) : max ? kick(t, tv[C.ticks.length - 1], 12, 9, 14) : { x: 0, y: 0, r: 0 }, enter = spring(u0, .5, 22);
      X(B.ctr, 790 + sh.x, 310 + sh.y + 3 * Math.sin(2 * Math.PI * .9 * t), 3 - 12 * (1 - spring(u0, .45, 18)) + 1.2 * Math.sin(2 * Math.PI * .7 * t), enter * ps);
      B.ctrFlash.setAttribute('fill', over ? '#FF2E4D' : '#fff');
      B.ctrFlash.setAttribute('opacity', (over ? .85 * Math.exp(-ut * 6) : max ? .7 * Math.exp(-um * 10) : .25 * Math.exp(-ut * 22)).toFixed(3));
      show(B.marks, max); if (max) B.marks.setAttribute('transform', `translate(${B.numX * (1 - spring(um, .45, 26))} 0) scale(${spring(um, .45, 26).toFixed(4)})`); } }

  // badge (persistent) with a tiny idle bob; fly-in from centre on the first 10 frames
  { const bx = t => { let cxp = 56 + B.bax, cyp = 150 + 2 * Math.sin(t * 2.4), br = .6 * Math.sin(t * 1.7), bs = 1;
      if (t < 10 * FR) { const a = clamp(t / (3 * FR)), k = E.outBack(clamp((t - 3 * FR) / (7 * FR)));
        bs = lerp(lerp(2.2, 1.9, E.outQuad(a)), 1, k); cxp = lerp(540, cxp, k); cyp = lerp(1060, cyp, k); br = lerp(-6, 0, k); }
      return [cxp - B.bax * bs, cyp - 50 * bs, br, bs]; };
    // fast frames: 24 in-page sub-samples across the shutter (frame-quantised, so every harness sample is identical -> one continuous smear)
    const tf = fN * FR, a = bx(tf - .25 * FR), b = bx(tf + .25 * FR), fast = Math.hypot(b[0] - a[0], b[1] - a[1]) + 180 * Math.abs(b[3] - a[3]) > 8;
    B.bcl.forEach((u, i) => { if (!fast && i) { show(u, false); return; } show(u, true);
      const v = fast ? bx(tf + (i / 47 - .5) * .5 * FR) : bx(t); X(u, v[0], v[1], v[2], v[3]); u.setAttribute('opacity', fast ? (1 / (i + 1)).toFixed(4) : '1'); }); }

  // end egg: the reviewer's note slides up under the card, types itself out, then its nitpick gets the marker (= 不能 No. 15)
  { const egg = $('egg'), u = t - C.egg, v = u >= 0; egg.style.visibility = v ? 'visible' : 'hidden';
    if (v) { const sc = B.eg.s * lerp(.86, 1, spring(u, .5, 22)), y = 1314 + 150 * (1 - spring(u, .55, 20)) + 3 * Math.sin(2 * Math.PI * .7 * t), r = -1.5 + 5 * (1 - spring(u, .45, 18)) + .4 * Math.sin(2 * Math.PI * .6 * t);
      egg.style.opacity = clamp(u / (3 * FR)).toFixed(3);
      egg.style.transform = `translate(${(60 + B.eg.w * B.eg.s / 2).toFixed(1)}px,${(y + B.eg.h * B.eg.s / 2).toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${sc.toFixed(4)}) translate(${(-B.eg.w / 2).toFixed(1)}px,${(-B.eg.h / 2).toFixed(1)}px)`;
      const n = Math.floor(EU.length * clamp((t - C.egg_text[0]) / (C.egg_text[1] - C.egg_text[0])) + 1e-6);
      EU.forEach((e, i) => { e.style.visibility = i < n ? 'visible' : 'hidden'; });
      const uk = t - C.tick15; B.egNeg.classList.toggle('on', uk >= 0); B.egNeg.style.backgroundSize = `${(uk >= 0 ? clamp(uk / (3 * FR)) * 100 : 0).toFixed(1)}% 100%`; } }

  // flashes (every 定格 opens on one), vignette, grain
  const fz0 = C.freezes.some(([a]) => fN === Math.round(a * 30) && a !== C.stamp1);
  let fl = fN === Math.round(C.hero * 30) ? 1 : fN === Math.round(C.freeze * 30) ? .85 : fN === Math.round(C.stamp1 * 30) ? .4 : fz0 ? .3 : 0;
  $('flash').style.opacity = fl.toFixed(3);
  $('vig').style.opacity = t >= C.hero ? 0 : 1;
  const fi = Math.round(t * 30); $('grain').style.backgroundPosition = `${Math.floor(h1(fi) * 2048)}px ${Math.floor(h1(fi + 777) * 2048)}px`;
};
build().then(() => { window.__ready = true; });
</script>
